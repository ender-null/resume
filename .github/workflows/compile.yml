name: Compile

# Replaces the previous compile-tectonic.yml + compile-texlive.yml, which between them
# ran 4 jobs and pulled ~5.7 GB of Docker images per push to produce two ~30 KB PDFs.
#
# Tectonic is kept over TeX Live: 94 MB image vs 2.74 GB, and it resolves packages
# deterministically. (compile-texlive.yml was already disabled by hand on GitHub since
# 2026-01-29 -- this makes that decision visible in the repo instead of only in the UI.)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One job, one image pull, all documents. A build matrix would remove the
      # duplicated YAML but still pull the image twice, and for a sub-second compile
      # the pull dominates the run.
      #
      # Delegating to `make docker` keeps the tectonic invocation and the output
      # filenames in the Makefile only. They used to be spelled out here as well --
      # in two separate jobs -- so renaming an output meant editing three copies.
      #
      # The Makefile chains the compiles with '&&', not ';'. The old workflow used
      # ';' and so reported success even when a compile failed -- which is how a
      # reference to a 'biber-mwe.tex' that has never existed in this repo survived: it
      # errored on every single run, and every run was still green. There is no
      # bibliography here, so no biber.
      - name: Build PDFs
        run: make docker

      # archive: false uploads each PDF as-is, so the run page offers
      # alin_trandafir_resume.pdf itself rather than a zip wrapping it. Without it,
      # every push did produce the PDFs, but only as .zip downloads. The artifact is
      # named after the file; `name` is ignored in this mode, so it is left out.
      - name: Upload English CV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: alin_trandafir_resume.pdf
          archive: false

      - name: Upload Spanish CV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: alin_trandafir_curriculum.pdf
          archive: false

      - name: Upload ETT CV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: alin_trandafir_curriculum_ett.pdf
          archive: false

  # Build artifacts expire after 90 days and need a GitHub login to download, which is
  # useless for a document whose whole purpose is being handed to people without GitHub
  # accounts. Tagging publishes a permanent, login-free URL; in particular
  # .../releases/latest/download/alin_trandafir_resume.pdf always resolves to the newest
  # tagged CV, so it is a stable link to put on a profile.
  #
  # Unaffected by '*.pdf' in .gitignore: this uploads via the API rather than committing.
  #
  # This job downloads what `build` already produced instead of compiling a second
  # time. It previously repeated the checkout and the full docker build, so every
  # tagged release pulled the image twice and typeset both documents twice -- and
  # nothing guaranteed the released PDFs were the ones the build job had tested.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # v8 or later: v7 unzips every download unconditionally and so cannot read the
      # unarchived PDFs uploaded above.
      - name: Download built PDFs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: alin_trandafir_*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            alin_trandafir_resume.pdf
            alin_trandafir_curriculum.pdf
            alin_trandafir_curriculum_ett.pdf
          generate_release_notes: true
